<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game by Paaras</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="paaras-style.css">
</head>
<body>
    <div class="body">
        <header class="app-header"><h1>Snake Game by Paaras</h1></header>

        <div class="game-container">
            <div id="scoreBox">Score: 0</div>
            <div id="hiscoreBox">HiScore: 0</div>
            <canvas id="gameCanvas" role="application" aria-label="Snake game canvas"></canvas>
        </div>

        <div class="leaderboard-section">
            <div class="player-info">
                <label for="playerName">Player Name:</label>
                <input type="text" id="playerName" placeholder="Enter your name" maxlength="50">
            </div>
            <div class="leaderboard-container">
                <h2>Leaderboard</h2>
                <div id="leaderboardList">Loading...</div>
                <button id="refreshLeaderboard">Refresh</button>
            </div>
        </div>
    </div>

    <script src="paaras.js"></script>
</body>
</html>
